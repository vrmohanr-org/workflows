name: nodejs-eks-ci
on:
  workflow_call:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string
      component:
        description: 'Component name'
        required: true
        type: string

env:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}

jobs:
  build-nodejs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: list files
        run: |
          ls -l
          echo "project=$project component=$component"

      - name: read-version
        id: version
        run: echo "app_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"